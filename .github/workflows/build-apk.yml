name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runner 自带 Android SDK，不再用第三方 setup-android action
      - name: Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK"
          ls -la "$SDK" || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SM" ] || [ ! -x "$SM" ]; then
            echo "::error::sdkmanager not found, dumping candidates"
            find /usr/local/lib/android -maxdepth 6 -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Gradle 8.2
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: |
          if [ -f alarm-probe/settings.gradle ]; then cd alarm-probe; fi
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alarmprobe-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
